profile:
  name: choomfie

# Brain = local Choomfie OpenAI endpoint (Claude Agent SDK on your Claude Code
# subscription). base_url takes precedence; bearer key = OPENAI_API_KEY in .env.
# Swap to any other model later by repointing base_url/provider — persona,
# memory, and tools stay identical.
model:
  default: opus                   # switch with `choomfie model` (sonnet / haiku / picker)
  provider: choomfie              # = the Agent-SDK provider below, so the picker selects it

# Choomfie's brains are registered as NAMED providers so Hermes's `model` picker
# lists them, highlights the current one (model.provider must equal the key), and
# shows their models (opus/sonnet/haiku, via the sidecar's /v1/models).
providers:
  # Claude on your subscription, run headless via the Agent SDK (metered pool).
  choomfie:
    name: Choomfie Claude (Agent SDK)
    base_url: http://127.0.0.1:4141/v1
    api_key_env: OPENAI_API_KEY
    default_model: opus
    models:
      - opus
      - sonnet
      - haiku
  # Claude via an interactive session (flat-rate pool). The :4142 bridge is not
  # built yet — registered so the picker shows it; selecting it won't route until
  # the interactive endpoint exists (deferred task).
  choomfie-interactive:
    name: Choomfie Claude (Interactive)
    base_url: http://127.0.0.1:4142/v1
    api_key_env: OPENAI_API_KEY
    default_model: opus
    models:
      - opus
      - sonnet
      - haiku

# Fallback brain — Hermes tries this when the primary fails (rate-limit /
# overload / connection). Local + free, so failures don't burn the metered
# Agent SDK credit. Requires Ollama running; remove if you don't use it.
fallback_providers:
  - provider: custom
    base_url: http://127.0.0.1:11434/v1
    model: llama3.1

gateway:
  enabled: true
  platforms:
    discord:
      enabled: true

discord:
  allow_mentions:
    everyone: false
    roles: false
    users: true
    replied_user: true

agent:
  gateway_auto_continue_freshness: 900
  max_turns: 50
  personalities:
    choomfie:
      description: Default Choomfie voice.
      system_prompt: Be casual, friendly, and fun. Talk like a cyberpunk buddy; use slang, be direct, and be a ride-or-die friend.

sessions:
  auto_prune: true
  retention_days: 30

compression:
  enabled: true
  threshold: 0.5
  target_ratio: 0.2
  protect_last_n: 20

plugins:
  enabled:
    - choomfie_commands
    - choomfie_reminders
    - choomfie_tutor

tools:
  enabled:
    - web
    - browser
    - github
    - memory
    - session_search
    - todo

terminal:
  cwd: .
  env_passthrough:
    - DISCORD_BOT_TOKEN
    - CHOOMFIE_LEGACY_DB
