profile:
  name: choomfie

# Brain = local Choomfie OpenAI endpoint (Claude Agent SDK on your Claude Code
# subscription). base_url takes precedence; bearer key = OPENAI_API_KEY in .env.
# Swap to any other model later by repointing base_url/provider — persona,
# memory, and tools stay identical.
model:
  default: choomfie-claude-code   # opus alias; use choomfie-claude-sonnet for lighter/cheaper
  provider: custom
  base_url: http://127.0.0.1:4141/v1

gateway:
  enabled: true
  platforms:
    discord:
      enabled: true

discord:
  allow_mentions:
    everyone: false
    roles: false
    users: true
    replied_user: true

agent:
  gateway_auto_continue_freshness: 900
  max_turns: 50
  personalities:
    choomfie:
      description: Default Choomfie voice.
      system_prompt: Be casual, friendly, and fun. Talk like a cyberpunk buddy; use slang, be direct, and be a ride-or-die friend.

sessions:
  auto_prune: true
  retention_days: 30

compression:
  enabled: true
  threshold: 0.5
  target_ratio: 0.2
  protect_last_n: 20

plugins:
  enabled:
    - choomfie_commands
    - choomfie_reminders
    - choomfie_tutor

tools:
  enabled:
    - web
    - browser
    - github
    - memory
    - session_search
    - todo

terminal:
  cwd: .
  env_passthrough:
    - DISCORD_BOT_TOKEN
    - CHOOMFIE_LEGACY_DB
